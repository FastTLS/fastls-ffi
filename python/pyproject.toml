[build-system]
requires = ["setuptools>=68", "wheel>=0.43"]
build-backend = "setuptools.build_meta"

[project]
name = "fastls"
dynamic = ["version"]
description = "Browser-profile HTTP client with streaming Python bindings to Fastls"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"

[tool.setuptools]
license-files = ["LICENSE", "THIRD_PARTY_LICENSES.txt"]

[tool.setuptools.packages.find]
where = ["."]
include = ["fastls*"]

[tool.setuptools.package-data]
fastls = ["py.typed", "*.pyi"]
