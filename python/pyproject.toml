[build-system]
requires = ["setuptools>=68", "wheel>=0.43"]
build-backend = "setuptools.build_meta"

[project]
name = "fastls-ffi"
dynamic = ["version"]
description = "Python bindings for the Fastls shared library (development preview)"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"

[tool.setuptools]
license-files = ["LICENSE", "THIRD_PARTY_LICENSES.txt"]

[tool.setuptools.packages.find]
where = ["."]
include = ["fastls*"]
