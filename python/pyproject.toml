[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fastls-ffi"
version = "0.1.0.dev0"
description = "Python bindings for the Fastls shared library (development preview)"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]
include = ["fastls*"]
