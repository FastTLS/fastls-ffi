name: Native library and Python SDK
permissions:
  contents: read
env:
  FASTLS_EXTENDED_SOAK_SECONDS: ${{ inputs.certification_soak_seconds || '300' }}
  FASTLS_PACKAGE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || format('0.1.5.dev{0}', github.run_number)
    }}
  FASTLS_RELEASE_MODE: ${{ github.ref_type == 'tag' && 'true' || 'false' }}
concurrency:
  group: ffi-ci-${{ github.workflow }}-${{ inputs.pypi_run_id != '' && format('pypi-{0}', inputs.pypi_version) ||
    github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' || inputs.pypi_run_id == '' }}
jobs:
  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      fastls_ref: ${{ steps.refs.outputs.fastls_ref }}
      ftransport_ref: ${{ steps.refs.outputs.ftransport_ref }}
      imitate_ref: ${{ steps.refs.outputs.imitate_ref }}
      matrix: ${{ steps.plan.outputs.matrix }}
      node_matrix: ${{ steps.plan.outputs.node_matrix }}
      native: ${{ steps.plan.outputs.native }}
      node: ${{ steps.plan.outputs.node }}
      node_soak: ${{ steps.plan.outputs.node_soak }}
      candidates: ${{ steps.plan.outputs.candidates }}
      pypi: ${{ steps.plan.outputs.pypi }}
      extended_matrix: ${{ steps.plan.outputs.extended_matrix }}
      plan: ${{ steps.plan.outputs.plan }}
      soak_seconds: ${{ steps.plan.outputs.soak_seconds }}
      extended_enabled: ${{ steps.plan.outputs.extended_enabled }}
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
        fetch-depth: 0
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.11'
    - name: Select test scope before provisioning toolchains
      id: plan
      env:
        TEST_TIER: ${{ inputs.test_tier }}
        FASTLS_REF: ${{ inputs.fastls_ref }}
        FTRANSPORT_REF: ${{ inputs.ftransport_ref }}
        IMITATE_REF: ${{ inputs.imitate_ref }}
        CERTIFICATION_SOAK_SECONDS: ${{ inputs.certification_soak_seconds }}
      run: python scripts/test_plan.py
    - name: Test scope selection and failure handling
      run: python -m unittest discover -s tests -p test_ci_plan.py -v
    - name: Check patch whitespace
      run: git diff --check HEAD^ HEAD
    - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
      with:
        go-version: 1.26.10
        cache: true
        cache-dependency-path: go.sum
      if: steps.plan.outputs.native == 'true'
    - name: Verify standalone remote module graph
      env:
        GOWORK: 'off'
      run: "go mod download\ngo mod verify\ngo list -m all\nif go mod graph | grep -F 'github.com/FastTLS/fhttp';\
        \ then\n  echo 'legacy fhttp dependency remains in the module graph' >&2\n  exit 1\nfi\n"
      if: steps.plan.outputs.native == 'true'
    - name: Require reviewed dependency commits
      id: refs
      env:
        FASTLS_REF: ${{ inputs.fastls_ref }}
        FTRANSPORT_REF: ${{ inputs.ftransport_ref }}
        IMITATE_REF: ${{ inputs.imitate_ref }}
      run: python scripts/ci.py resolve
      if: steps.plan.outputs.native == 'true'
    - name: Test package publication boundaries
      run: python tests/test_pypi.py
      if: steps.plan.outputs.native == 'true'
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
      with:
        node-version: '22'
      if: steps.plan.outputs.native == 'true'
    - name: Check Python 3.10 API types
      run: npm exec --yes --package=pyright@1.1.414 -- pyright --project tests/pyrightconfig.json
      if: steps.plan.outputs.native == 'true'
    if: github.event_name != 'workflow_dispatch' || inputs.pypi_run_id == ''
  native:
    needs: dependencies
    name: Build / ${{ matrix.config.target }}-go${{ matrix.config.go }}-py${{ matrix.config.python }}
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJSON(needs.dependencies.outputs.matrix) }}
    runs-on: ${{ matrix.config.runner }}
    timeout-minutes: 30
    env:
      CGO_ENABLED: '1'
      FASTLS_CI_TARGET: ${{ matrix.config.target }}
      FASTLS_STABILITY_SECONDS: '30'
    defaults:
      run:
        working-directory: workspace/fastls-ffi
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        path: workspace/fastls-ffi
        persist-credentials: false
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        repository: FastTLS/fastls
        ref: ${{ needs.dependencies.outputs.fastls_ref }}
        path: workspace/fastls
        persist-credentials: false
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        repository: FastTLS/ftransport
        ref: ${{ needs.dependencies.outputs.ftransport_ref }}
        path: workspace/ftransport
        persist-credentials: false
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        repository: FastTLS/imitate
        ref: ${{ needs.dependencies.outputs.imitate_ref }}
        path: workspace/imitate
        persist-credentials: false
    - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
      with:
        go-version: ${{ matrix.config.go }}
        cache: true
        cache-dependency-path: 'workspace/fastls-ffi/go.sum

          workspace/fastls-ffi/ci/dependencies.json

          '
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: ${{ matrix.config.python }}
    - name: Install pinned Linux wheel audit tools
      if: runner.os == 'Linux'
      run: python -m pip install auditwheel==6.8.2 patchelf==0.19.1.0
    - name: Build native library, fixture and bundled wheel
      run: python scripts/ci.py run --stage build
    - name: Share immutable platform inputs
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      with:
        name: inputs-${{ matrix.config.target }}-go${{ matrix.config.go }}-py${{ matrix.config.python }}
        path: 'workspace/fastls-ffi/dist/

          workspace/fastls-ffi/build/ffi-fixture*

          workspace/fastls-ffi/go.work

          '
        if-no-files-found: error
        retention-days: 14
    - name: Retain build evidence
      if: always()
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      with:
        name: build-evidence-${{ matrix.config.target }}-go${{ matrix.config.go }}-py${{ matrix.config.python }}
        path: workspace/fastls-ffi/build/ci-*/
        retention-days: 14
    if: needs.dependencies.outputs.native == 'true'
  tests:
    needs:
    - dependencies
    - native
    name: Python checks / ${{ matrix.config.target }}-go${{ matrix.config.go }}-py${{ matrix.config.python }}
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJSON(needs.dependencies.outputs.matrix) }}
    runs-on: ${{ matrix.config.runner }}
    timeout-minutes: 40
    env:
      CGO_ENABLED: '1'
      FASTLS_CI_TARGET: ${{ matrix.config.target }}
      FASTLS_STABILITY_SECONDS: '30'
    defaults:
      run:
        working-directory: workspace/fastls-ffi
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        path: workspace/fastls-ffi
        persist-credentials: false
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        repository: FastTLS/fastls
        ref: ${{ needs.dependencies.outputs.fastls_ref }}
        path: workspace/fastls
        persist-credentials: false
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        repository: FastTLS/ftransport
        ref: ${{ needs.dependencies.outputs.ftransport_ref }}
        path: workspace/ftransport
        persist-credentials: false
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        repository: FastTLS/imitate
        ref: ${{ needs.dependencies.outputs.imitate_ref }}
        path: workspace/imitate
        persist-credentials: false
    - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
      with:
        go-version: ${{ matrix.config.go }}
        cache: true
        cache-dependency-path: 'workspace/fastls-ffi/go.sum

          workspace/fastls-ffi/ci/dependencies.json

          '
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: ${{ matrix.config.python }}
    - name: Download this platform's immutable inputs
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: inputs-${{ matrix.config.target }}-go${{ matrix.config.go }}-py${{ matrix.config.python }}
        path: workspace/fastls-ffi
    - name: Verify inputs and execute all Python stages once
      run: python -c "import subprocess,sys; [subprocess.run([sys.executable,'scripts/ci.py','run','--stage',stage],check=True)
        for stage in ('contracts','source','wheel','release')]"
    - name: Retain certified candidate
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      with:
        name: ${{ github.ref_type == 'tag' && 'release-candidate' || format('development-snapshot-{0}', github.run_number)
          }}-${{ matrix.config.target }}-go${{ matrix.config.go }}-py${{ matrix.config.python }}
        path: 'workspace/fastls-ffi/dist/*.whl

          workspace/fastls-ffi/dist/*.tar.gz

          workspace/fastls-ffi/dist/build-info.json

          workspace/fastls-ffi/dist/native-audit.json

          workspace/fastls-ffi/dist/development-snapshot.json

          workspace/fastls-ffi/dist/release-manifest.json

          '
        if-no-files-found: error
        retention-days: 14
    - name: Retain contracts evidence
      if: always()
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      with:
        name: evidence-contracts-${{ matrix.config.target }}-go${{ matrix.config.go }}-py${{ matrix.config.python
          }}
        path: 'workspace/fastls-ffi/build/ci-*/contracts/

          workspace/fastls-ffi/build/stability-*.json

          workspace/fastls-ffi/build/checks-*/

          '
        retention-days: 14
    - name: Retain source evidence
      if: always()
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      with:
        name: evidence-source-${{ matrix.config.target }}-go${{ matrix.config.go }}-py${{ matrix.config.python }}
        path: 'workspace/fastls-ffi/build/ci-*/source/

          workspace/fastls-ffi/build/stability-*.json

          workspace/fastls-ffi/build/checks-*/

          '
        retention-days: 14
    - name: Retain wheel evidence
      if: always()
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      with:
        name: evidence-wheel-${{ matrix.config.target }}-go${{ matrix.config.go }}-py${{ matrix.config.python }}
        path: 'workspace/fastls-ffi/build/ci-*/wheel/

          workspace/fastls-ffi/build/stability-*.json

          workspace/fastls-ffi/build/checks-*/

          '
        retention-days: 14
    - name: Retain release evidence
      if: always()
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      with:
        name: evidence-release-${{ matrix.config.target }}-go${{ matrix.config.go }}-py${{ matrix.config.python
          }}
        path: 'workspace/fastls-ffi/build/ci-*/release/

          workspace/fastls-ffi/build/stability-*.json

          workspace/fastls-ffi/build/checks-*/

          '
        retention-days: 14
  extended:
    needs:
    - dependencies
    - native
    name: ${{ matrix.stage }} / linux-amd64
    strategy:
      fail-fast: false
      matrix:
        config:
        - runner: ubuntu-24.04
          target: linux-amd64
          go: 1.26.10
          python: '3.11'
        stage: ${{ fromJSON(needs.dependencies.outputs.extended_matrix) }}
    runs-on: ${{ matrix.config.runner }}
    timeout-minutes: ${{ ((inputs.certification_soak_seconds != '' && inputs.certification_soak_seconds != '300')
      || needs.dependencies.outputs.soak_seconds == '3600') && 150 || 30 }}
    env:
      CGO_ENABLED: '1'
      FASTLS_CI_TARGET: ${{ matrix.config.target }}
      FASTLS_STABILITY_SECONDS: '30'
      FASTLS_EXTENDED_SOAK_SECONDS: ${{ inputs.certification_soak_seconds || needs.dependencies.outputs.soak_seconds
        }}
    defaults:
      run:
        working-directory: workspace/fastls-ffi
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        path: workspace/fastls-ffi
        persist-credentials: false
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        repository: FastTLS/fastls
        ref: ${{ needs.dependencies.outputs.fastls_ref }}
        path: workspace/fastls
        persist-credentials: false
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        repository: FastTLS/ftransport
        ref: ${{ needs.dependencies.outputs.ftransport_ref }}
        path: workspace/ftransport
        persist-credentials: false
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        repository: FastTLS/imitate
        ref: ${{ needs.dependencies.outputs.imitate_ref }}
        path: workspace/imitate
        persist-credentials: false
    - if: matrix.stage == 'contracts' || matrix.stage == 'race'
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
      with:
        go-version: ${{ matrix.config.go }}
        cache: true
        cache-dependency-path: 'workspace/fastls-ffi/go.sum

          workspace/fastls-ffi/ci/dependencies.json

          '
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: ${{ matrix.config.python }}
    - name: Download this platform's immutable inputs
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: inputs-${{ matrix.config.target }}-go${{ matrix.config.go }}-py${{ matrix.config.python }}
        path: workspace/fastls-ffi
    - name: Verify inputs and execute selected stage
      run: python scripts/ci.py run --stage ${{ matrix.stage }}
    - name: Retain incremental evidence
      if: always()
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      with:
        name: evidence-${{ matrix.stage }}-${{ matrix.config.target }}-go${{ matrix.config.go }}-py${{ matrix.config.python
          }}
        path: 'workspace/fastls-ffi/build/ci-*/

          workspace/fastls-ffi/build/stability-*.json

          workspace/fastls-ffi/build/checks-*/

          '
        retention-days: 14
    if: needs.dependencies.outputs.extended_enabled == 'true'
  required:
    name: All native tests
    if: always() && (github.event_name != 'workflow_dispatch' || inputs.pypi_run_id == '')
    needs:
    - dependencies
    - native
    - tests
    - extended
    - node
    - node-soak
    - node-candidates
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
    - name: Require exactly the checks selected by the plan
      env:
        TEST_PLAN: ${{ needs.dependencies.outputs.plan }}
        TEST_RESULTS: ${{ toJSON(needs) }}
      run: python scripts/test_plan.py --check-results
  publish-github-release:
    name: Publish GitHub release
    if: github.ref_type == 'tag'
    needs: required
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
    - name: Check out release source
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
        fetch-depth: 0
    - name: Download certified platform candidates
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        pattern: release-candidate-*
        path: candidates
    - name: Assemble canonical GitHub assets
      shell: bash
      run: "set -euo pipefail\nmkdir release-assets\nfor directory in candidates/release-candidate-*-go1.26.10-*;\
        \ do\n  target=\"$(basename \"${directory}\" | sed -E 's/^release-candidate-(.*)-go1\\.26\\.10-py.*/\\1/')\"\
        \n  cp \"${directory}\"/*.whl release-assets/\n  cp \"${directory}/release-manifest.json\" \"release-assets/release-manifest-${target}.json\"\
        \n  cp \"${directory}/build-info.json\" \"release-assets/build-info-${target}.json\"\n  cp \"${directory}/native-audit.json\"\
        \ \"release-assets/native-audit-${target}.json\"\ndone\ncp \"$(find candidates -path '*linux-amd64-go1.26.10-py3.11/*.tar.gz'\
        \ -print -quit)\" release-assets/\ntest \"$(find release-assets -name '*.whl' | wc -l)\" -eq 5\ntest \"\
        $(find release-assets -name '*.tar.gz' | wc -l)\" -eq 1\n(cd release-assets && sha256sum * > SHA256SUMS)\n"
    - name: Sign release provenance
      id: attest
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
      with:
        subject-checksums: release-assets/SHA256SUMS
    - name: Publish only to GitHub Releases
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: 'set -euo pipefail

        cp ''${{ steps.attest.outputs.bundle-path }}'' release-assets/provenance.sigstore.json

        gh release create "${GITHUB_REF_NAME}" release-assets/* --verify-tag --generate-notes --title "fastls-ffi
        ${GITHUB_REF_NAME}"

        '
  node:
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJSON(needs.dependencies.outputs.node_matrix) }}
    runs-on: ${{ matrix.config.runner }}
    env:
      CGO_ENABLED: '1'
      FASTLS_CI_RACE: ${{ matrix.config.race }}
      FASTLS_CI_TARGET: ${{ matrix.config.target }}
      FASTLS_STABILITY_SECONDS: '30'
      FASTLS_REF: ${{ needs.dependencies.outputs.fastls_ref }}
      FTRANSPORT_REF: ${{ needs.dependencies.outputs.ftransport_ref }}
      IMITATE_REF: ${{ needs.dependencies.outputs.imitate_ref }}
    defaults:
      run:
        working-directory: workspace/fastls-ffi
    timeout-minutes: 40
    needs:
    - dependencies
    - native
    name: Node checks / ${{ matrix.config.target }} / Go ${{ matrix.config.go }} / Node ${{ matrix.config.node }}
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        path: workspace/fastls-ffi
        persist-credentials: false
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        repository: FastTLS/fastls
        ref: ${{ needs.dependencies.outputs.fastls_ref }}
        path: workspace/fastls
        persist-credentials: false
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        repository: FastTLS/ftransport
        ref: ${{ needs.dependencies.outputs.ftransport_ref }}
        path: workspace/ftransport
        persist-credentials: false
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        repository: FastTLS/imitate
        ref: ${{ needs.dependencies.outputs.imitate_ref }}
        path: workspace/imitate
        persist-credentials: false
    - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
      with:
        go-version: ${{ matrix.config.go }}
        cache: false
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: ${{ matrix.config.python }}
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
      with:
        node-version: ${{ matrix.config.node }}
        cache: npm
        cache-dependency-path: workspace/fastls-ffi/node/package-lock.json
    - name: Download verified build inputs
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: inputs-${{ matrix.config.target }}-go${{ matrix.config.go }}-py${{ matrix.config.python }}
        path: workspace/fastls-ffi
    - name: Restore fixture executable permission
      if: runner.os != 'Windows'
      run: chmod +x build/ffi-fixture
    - name: Verify build provenance before consuming binaries
      run: python scripts/ci.py run --stage verify
    - name: Install locked Node dependencies
      run: npm ci --prefix node
    - name: Full Node source suite
      run: npm test --prefix node
    - name: Source cookie compatibility in a fresh process
      run: node node/scripts/test-cookie-compat.mjs
    - name: Save source test evidence
      if: always()
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      with:
        name: node-source-${{ matrix.config.target }}-go${{ matrix.config.go }}-py${{ matrix.config.python }}-node${{
          matrix.config.node }}
        path: workspace/fastls-ffi/build/*.json
        if-no-files-found: error
        retention-days: 14
    - name: Full installed native package suite
      run: npm run test:package --prefix node
    - name: Verify npm platform dependency installation
      run: npm run test:npm --prefix node
    - name: Verify npm release rejection paths
      if: matrix.config.target == 'linux-amd64' && matrix.config.node == '24'
      run: python node/scripts/test-npm-release.py
    - name: Save binaries and evidence
      if: always()
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      with:
        name: node-functional-${{ matrix.config.target }}-go${{ matrix.config.go }}-py${{ matrix.config.python }}-node${{
          matrix.config.node }}
        path: 'workspace/fastls-ffi/dist/

          workspace/fastls-ffi/build/

          workspace/fastls-ffi/node/dist/

          '
        if-no-files-found: warn
        retention-days: 14
    if: needs.dependencies.outputs.node == 'true'
  node-soak:
    strategy:
      fail-fast: false
      matrix:
        include:
        - runner: ubuntu-24.04
          target: linux-amd64
          go: 1.26.10
          python: '3.11'
          node: '24'
          race: true
          kind: generic
        - runner: ubuntu-24.04
          target: linux-amd64
          go: 1.26.10
          python: '3.11'
          node: '24'
          race: true
          kind: duplex
        - runner: ubuntu-24.04
          target: linux-amd64
          go: 1.26.10
          python: '3.11'
          node: '24'
          race: true
          kind: sse
        - runner: ubuntu-24.04
          target: linux-amd64
          go: 1.26.10
          python: '3.11'
          node: '24'
          race: true
          kind: proxy
        - runner: ubuntu-24.04
          target: linux-amd64
          go: 1.26.10
          python: '3.11'
          node: '24'
          race: true
          kind: ws
    runs-on: ${{ matrix.runner }}
    env:
      CGO_ENABLED: '1'
      FASTLS_CI_RACE: ${{ matrix.race }}
      FASTLS_CI_TARGET: ${{ matrix.target }}
      FASTLS_STABILITY_SECONDS: '300'
      FASTLS_NODE_SOAK_SECONDS: '300'
      FASTLS_NODE_DUPLEX_SOAK_SECONDS: '60'
      FASTLS_NODE_SSE_SOAK_SECONDS: '60'
      FASTLS_NODE_PROXY_SOAK_SECONDS: '60'
      FASTLS_NODE_WS_SOAK_SECONDS: '60'
      FASTLS_TEST_LABEL: extended
      FASTLS_REF: ${{ needs.dependencies.outputs.fastls_ref }}
      FTRANSPORT_REF: ${{ needs.dependencies.outputs.ftransport_ref }}
      IMITATE_REF: ${{ needs.dependencies.outputs.imitate_ref }}
    defaults:
      run:
        working-directory: workspace/fastls-ffi
    timeout-minutes: 15
    needs:
    - dependencies
    - native
    name: Resource recovery / ${{ matrix.kind }}
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        path: workspace/fastls-ffi
        persist-credentials: false
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        repository: FastTLS/fastls
        ref: ${{ needs.dependencies.outputs.fastls_ref }}
        path: workspace/fastls
        persist-credentials: false
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        repository: FastTLS/ftransport
        ref: ${{ needs.dependencies.outputs.ftransport_ref }}
        path: workspace/ftransport
        persist-credentials: false
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        repository: FastTLS/imitate
        ref: ${{ needs.dependencies.outputs.imitate_ref }}
        path: workspace/imitate
        persist-credentials: false
    - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
      with:
        go-version: ${{ matrix.go }}
        cache: false
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: ${{ matrix.python }}
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
      with:
        node-version: ${{ matrix.node }}
    - name: Download verified build inputs
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: inputs-${{ matrix.target }}-go${{ matrix.go }}-py${{ matrix.python }}
        path: workspace/fastls-ffi
    - name: Restore fixture executable permission
      if: runner.os != 'Windows'
      run: chmod +x build/ffi-fixture
    - name: Verify build provenance
      run: python scripts/ci.py run --stage verify
    - name: Install locked Node dependencies
      if: matrix.kind != 'python'
      run: npm ci --prefix node
    - name: Build Node SDK
      if: matrix.kind != 'python'
      run: npm run build --prefix node
    - name: Run generic resource recovery
      if: matrix.kind == 'generic'
      run: npm run test:soak --prefix node
    - name: Run duplex resource recovery
      if: matrix.kind == 'duplex'
      run: npm run test:duplex:soak --prefix node
    - name: Run sse resource recovery
      if: matrix.kind == 'sse'
      run: npm run test:sse:soak --prefix node
    - name: Run proxy resource recovery
      if: matrix.kind == 'proxy'
      run: npm run test:proxy:soak --prefix node
    - name: Run ws resource recovery
      if: matrix.kind == 'ws'
      run: npm run test:ws:soak --prefix node
    - name: Run python resource recovery
      if: matrix.kind == 'python'
      run: python tests/test_stability.py Stability.test_soak_and_resource_recovery
    - name: Save independent resource evidence
      if: always()
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      with:
        name: node-soak-${{ matrix.kind }}
        path: workspace/fastls-ffi/build/*.json
        if-no-files-found: error
        retention-days: 14
    if: needs.dependencies.outputs.node_soak == 'true'
  node-candidates:
    needs:
    - dependencies
    - node
    - node-soak
    name: Candidate / ${{ matrix.target }}-go${{ matrix.go }}-py${{ matrix.python }}-node${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.dependencies.outputs.node_matrix) }}
    steps:
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: node-functional-${{ matrix.target }}-go${{ matrix.go }}-py${{ matrix.python }}-node${{ matrix.node
          }}
        path: candidate
    - name: Merge matching source evidence into the candidate
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: node-source-${{ matrix.target }}-go${{ matrix.go }}-py${{ matrix.python }}-node${{ matrix.node }}
        path: candidate/build
    - if: matrix.race && needs.dependencies.outputs.node_soak == 'true'
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        pattern: node-soak-*
        merge-multiple: true
        path: candidate/build
    - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      with:
        name: fastls-${{ matrix.target }}-go${{ matrix.go }}-py${{ matrix.python }}-node${{ matrix.node }}
        path: candidate/
        if-no-files-found: error
        retention-days: 14
    if: always() && needs.dependencies.outputs.candidates == 'true' && needs.node.result == 'success' && (needs.node-soak.result
      == 'success' || (needs.dependencies.outputs.node_soak == 'false' && needs.node-soak.result == 'skipped'))
  pypi-candidate:
    name: Validate PyPI package set
    needs:
    - dependencies
    - required
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.11'
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        pattern: ${{ github.ref_type == 'tag' && 'release-candidate-*' || format('development-snapshot-{0}-*', github.run_number)
          }}
        path: candidates
    - name: Verify identity, provenance and all five platform tags
      shell: bash
      run: 'set -euo pipefail

        flags=()

        if [[ "$FASTLS_RELEASE_MODE" == true ]]; then flags+=(--formal); fi

        python scripts/prepare_pypi.py candidates pypi-dist "${flags[@]}"

        python -m pip install twine==7.0.0

        python -m twine check --strict pypi-dist/*

        '
    - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      with:
        name: pypi-validated
        path: pypi-dist/
        if-no-files-found: error
        retention-days: 14
    if: needs.dependencies.outputs.pypi == 'true'
  publish-pypi:
    name: Publish fastls to PyPI
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs:
    - pypi-candidate
    - publish-github-release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/fastls
    permissions:
      contents: read
      id-token: write
    steps:
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: pypi-validated
        path: dist/
    - name: Publish using PyPI Trusted Publishing
      uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
      with:
        packages-dir: dist/
        attestations: true
  resume-pypi:
    name: Resume certified PyPI upload
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.pypi_run_id != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/fastls
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      PYPI_SOURCE_RUN: ${{ inputs.pypi_run_id }}
      PYPI_VERSION: ${{ inputs.pypi_version }}
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.11'
    - name: Require certified tag, source run and successful release gates
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: python scripts/resume_pypi.py validate-run
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: pypi-validated
        path: dist/
        run-id: ${{ inputs.pypi_run_id }}
        github-token: ${{ secrets.GITHUB_TOKEN }}
    - name: Verify exact published bytes, package identity and source commit
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: python scripts/resume_pypi.py verify-files
    - name: Upload original artifacts using the configured Trusted Publisher
      uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
      with:
        packages-dir: dist/
        attestations: true
'on':
  push: null
  pull_request: null
  workflow_dispatch:
    inputs:
      fastls_ref:
        description: Reviewed FastTLS/fastls commit SHA (optional override)
        type: string
      ftransport_ref:
        description: Reviewed FastTLS/ftransport commit SHA (optional override)
        type: string
      imitate_ref:
        description: Reviewed FastTLS/imitate commit SHA (optional override)
        type: string
      certification_soak_seconds:
        description: Optional explicit Python resource observation, 300..7200 seconds; tier default otherwise
        type: string
        default: ''
      pypi_run_id:
        description: 'Resume only the PyPI upload from this certified tag-push run ID (blank: normal full CI)'
        type: string
      pypi_version:
        description: Existing official X.Y.Z version to upload without rebuilding (used with pypi_run_id)
        type: string
      test_tier:
        description: Minimum test scope; risk and release requirements may raise it
        type: choice
        options:
        - auto
        - patch
        - minor
        - major
        default: auto
