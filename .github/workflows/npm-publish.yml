name: Prepare or publish npm packages
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful same-commit main CI run ID
        type: string
        required: true
      publish:
        description: Publish the verified package set to npm (false prepares only)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: npm-release
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Read certified CI run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
        run: gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" > certified-run.json
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          pattern: fastls-*
          path: candidates
      - name: Assemble verified npm package set
        env:
          PUBLISH: ${{ inputs.publish }}
        run: |
          args=()
          if [[ "$PUBLISH" == true ]]; then args+=(--publishable); fi
          python node/scripts/assemble-npm.py certified-run.json candidates npm-release "${args[@]}"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: npm-release
          path: npm-release/
          if-no-files-found: error
  verify-trust:
    needs: prepare
    runs-on: ubuntu-24.04
    environment: npm
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - name: Verify all six live OIDC trust relationships before uploading
        run: node node/scripts/check-npm-oidc.mjs
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: npm-trust-verification
          path: npm-trust-verification.json
          if-no-files-found: error
  publish:
    if: inputs.publish
    needs: [prepare, verify-trust]
    runs-on: ubuntu-24.04
    environment: npm
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: npm-release
          path: npm-release
      - name: Publish native packages first and main package last
        run: npm run publish:npm --prefix node
