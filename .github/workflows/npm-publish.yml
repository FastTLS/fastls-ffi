name: Prepare or publish npm packages
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful certified main CI run; newer source may change verified publishing tools only
        type: string
        required: true
      publish:
        description: Publish the verified package set to npm (false prepares only)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: npm-release
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    timeout-minutes: 10
    outputs:
      source: ${{ steps.source.outputs.source }}
      version: ${{ steps.source.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Verify publication identity, promotion and archive rejection paths
        run: |
          node --test node/scripts/test-npm-oidc.mjs node/scripts/test-npm-recovery.mjs
          python -m unittest discover -s node/scripts -p test_npm_recovery.py -v
          python node/scripts/test-npm-promotion.py
          python node/scripts/test-npm-release.py
      - name: Read certified CI run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
        run: gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" > certified-run.json
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          pattern: fastls-*
          path: candidates
      - name: Assemble verified npm package set
        env:
          PUBLISH: ${{ inputs.publish }}
        run: |
          args=()
          if [[ "$PUBLISH" == true ]]; then args+=(--publishable); fi
          python node/scripts/assemble-npm.py certified-run.json candidates npm-release "${args[@]}"
      - name: Record immutable producer and version
        id: source
        run: python -c "import json,os; p=json.load(open('npm-release/npm-release-manifest.json')); f=open(os.environ['GITHUB_OUTPUT'],'a'); f.write('source='+p['revision']+'\nversion='+p['version']+'\n')"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: npm-release
          path: npm-release/
          if-no-files-found: error
  verify-trust:
    needs: prepare
    runs-on: ubuntu-24.04
    environment: npm
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - name: Verify all six live OIDC trust relationships before uploading
        run: node node/scripts/check-npm-oidc.mjs
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: npm-trust-verification
          path: npm-trust-verification.json
          if-no-files-found: error
  publish:
    if: inputs.publish
    needs: [prepare, verify-trust]
    runs-on: ubuntu-24.04
    environment: npm
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: npm-release
          path: npm-release
      - name: Publish native packages first and main package last
        run: npm run publish:npm --prefix node
      - name: Bind exact archives and producer metadata
        run: |
          cd npm-release
          sha256sum *.tgz npm-release-manifest.json RELEASE_NOTES.md > SHA256SUMS
      - name: Sign original archive promotion provenance
        id: promotion
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-checksums: npm-release/SHA256SUMS
          predicate-type: https://fasttls.github.io/attestations/npm-promotion/v1
          predicate-path: npm-release/npm-release-manifest.json
      - name: Publish the original npm archives and promotion proof on GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          SOURCE_REVISION: ${{ needs.prepare.outputs.source }}
          BUNDLE_PATH: ${{ steps.promotion.outputs.bundle-path }}
        run: |
          cp "$BUNDLE_PATH" npm-release/provenance.sigstore.json
          gh release create "node-v${VERSION}" npm-release/* --verify-tag --title "@fastls/fastls ${VERSION}" --notes-file npm-release/RELEASE_NOTES.md
      - name: Preserve per-attempt publication progress
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: npm-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: npm-release/publication-*.json
          if-no-files-found: warn
