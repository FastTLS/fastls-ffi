name: Isolated Node resource diagnosis
on:
  workflow_dispatch:
    inputs:
      profile:
        type: choice
        options: [smoke, full]
        default: smoke
permissions:
  contents: read
  actions: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        library: [old, new]
        heap: [default, bounded]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.22.3'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: inputs-linux-amd64-go1.26.10-py3.11
          run-id: 45000183207
          github-token: ${{ github.token }}
          path: .
      - name: Verify frozen candidate and fetch fixed previous release control
        run: |
          python - <<'PY'
          import json,hashlib,urllib.request,zipfile,io,pathlib
          info=json.load(open('dist/ci-inputs.json'))
          for name,digest in info['artifacts'].items():
              p=pathlib.Path(name)
              assert not p.is_absolute() and '..' not in p.parts
              assert hashlib.sha256(p.read_bytes()).hexdigest()==digest
          with urllib.request.urlopen('https://pypi.org/pypi/fastls/0.7.2/json') as r:meta=json.load(r)
          item=next(x for x in meta['urls'] if x['filename'].endswith('manylinux_2_39_x86_64.whl'))
          with urllib.request.urlopen(item['url']) as r:data=r.read()
          assert hashlib.sha256(data).hexdigest()==item['digests']['sha256']
          with zipfile.ZipFile(io.BytesIO(data)) as z:
              name=next(n for n in z.namelist() if n.endswith('/libfastls.so'))
              pathlib.Path('dist/old-libfastls.so').write_bytes(z.read(name))
          pathlib.Path('build/control-identity.json').write_text(json.dumps({'old_wheel':item['filename'],'sha256':item['digests']['sha256'],'new_source':info['sources'],'node':'24.22.3','duration_seconds':300,'limits_unchanged':True},indent=2))
          PY
          chmod +x build/ffi-fixture
          npm ci --prefix node --ignore-scripts
          npm run build --prefix node
      - name: Run one diagnostic per fixed library and VM configuration
        env:
          LIBRARY: ${{ matrix.library }}
          HEAP: ${{ matrix.heap }}
          FASTLS_NODE_SOAK_SECONDS: '300'
        run: |
          export FASTLS_LIBRARY="$PWD/dist/libfastls.so"
          if [[ "$LIBRARY" == old ]]; then export FASTLS_LIBRARY="$PWD/dist/old-libfastls.so"; fi
          args=()
          if [[ "$HEAP" == bounded ]]; then args+=(--max-semi-space-size=16); fi
          node "${args[@]}" --expose-gc --test --test-name-pattern=test_soak_and_resource_recovery node/tests/parity.test.mjs
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: diagnosis-${{ matrix.library }}-${{ matrix.heap }}
          path: build/*.json
          if-no-files-found: error
